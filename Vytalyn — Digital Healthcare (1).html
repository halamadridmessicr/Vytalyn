<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"><title>Vytalyn — Digital Healthcare</title>
<style>
:root{--bg:#f6fafa;--card:#fff;--tx:#17323a;--mu:#5b7279;--pr:#0f8b8d;--pr2:#0a6e70;--ln:#dbe8ea;--ok:#2e9e6b;--wn:#c0392b;--sf:#e6f4f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--card:#162428;--tx:#e6f1f2;--mu:#93aab0;--ln:#264047;--sf:#183238}}
:root[data-theme="dark"]{--bg:#0f1b1e;--card:#162428;--tx:#e6f1f2;--mu:#93aab0;--ln:#264047;--sf:#183238}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.65 "Nunito","Noto Sans Devanagari",system-ui,sans-serif}
a{color:var(--pr)}h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:1.3rem;color:var(--pr);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px}nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--tx);font-size:.95rem}
nav a.on,nav a:hover{background:var(--sf);color:var(--pr)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:0 1px 6px rgba(0,60,70,.06);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
button,.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
button:hover,.btn:hover{background:var(--pr2)}button.sec{background:var(--sf);color:var(--pr)}button.dn{background:var(--wn)}button.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.95rem}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mu{color:var(--mu)}.tag{display:inline-block;background:var(--sf);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:.85rem}
.hero{text-align:center;padding:40px 10px}.hero h1{font-size:2.3rem;color:var(--pr)}
.warn{background:#fff6e0;color:#5a4300;border:1px solid #f0d58a;border-radius:12px;padding:12px;font-size:.92rem}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3a3115;color:#f3e2a8;border-color:#6b5a1d}}
.item{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}.ok{color:var(--ok);font-weight:700}.bad{color:var(--wn);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#17323a;color:#fff;padding:10px 18px;border-radius:12px;z-index:9}
.tw{overflow-x:auto}
button,.btn{background:linear-gradient(135deg,#14a0a2,#0c7c7e);box-shadow:0 2px 6px rgba(15,139,141,.25);text-align:center;min-width:104px;border-radius:14px;transition:transform .1s,filter .1s}
button:hover,.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
button.sm,.btn.sm{min-width:92px}
button.bl,.btn.bl{background:linear-gradient(135deg,#4a9be0,#2f72bd);box-shadow:0 2px 6px rgba(47,114,189,.25)}
button.gn,.btn.gn{background:linear-gradient(135deg,#43b98a,#2a8f66);box-shadow:0 2px 6px rgba(42,143,102,.25)}
button.pu,.btn.pu{background:linear-gradient(135deg,#9276d6,#6d4cb8);box-shadow:0 2px 6px rgba(109,76,184,.25)}
button.am,.btn.am{background:linear-gradient(135deg,#f0ae4a,#d98a1c);box-shadow:0 2px 6px rgba(217,138,28,.25)}
button.dn{background:linear-gradient(135deg,#e5655a,#bb3326);box-shadow:0 2px 6px rgba(187,51,38,.25)}
.act{display:flex;flex-wrap:wrap;gap:8px}.qa{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.qa .btn,.qa button{width:100%;display:block}
.pt{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--ln);border-radius:14px;overflow:hidden}.pt th{width:36%;text-align:left;background:var(--sf);color:var(--pr);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--ln);vertical-align:middle}.pt td{padding:8px 14px;border-bottom:1px solid var(--ln)}.pt tr:last-child th,.pt tr:last-child td{border-bottom:0}.pt label{margin:0}
.grid{align-items:start}
footer{text-align:center;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));color:var(--mu);border-top:1px solid var(--ln);background:var(--card);font-size:.92rem;line-height:1.7}
.chat{display:flex;flex-direction:column}.msgs{height:min(58vh,520px);min-height:300px;overflow-y:auto;padding:10px;background:var(--bg);border:1px solid var(--ln);border-radius:14px}
.m{display:flex;margin:8px 0}.m.u{justify-content:flex-end}.bub{max-width:84%;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--ln);border-bottom-left-radius:4px;overflow-wrap:anywhere}
.m.u .bub{background:linear-gradient(135deg,#14a0a2,#0c7c7e);color:#fff;border:0;border-bottom-left-radius:18px;border-bottom-right-radius:4px}.bub.er{border-color:var(--wn)}.mt{margin-top:6px}
.comp{display:flex;gap:8px;align-items:flex-end;margin-top:10px}.comp textarea{flex:1;resize:none}.comp button{min-width:56px;padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}.chip{min-width:0!important;box-shadow:none!important;font-weight:600;padding:8px 14px;border-radius:20px}
.ai .out{background:var(--sf);border-radius:12px;padding:14px;margin-bottom:12px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>

const fmt=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const PR=()=>hi()?['ब्लड टेस्ट में कोलेस्ट्रॉल ज़्यादा आने का क्या मतलब है?','डॉक्टर से पूछने के सवाल बनाने में मदद करें','HbA1c को आसान शब्दों में समझाएँ','मुझे इमरजेंसी में कब जाना चाहिए?']:['What does high cholesterol in a blood test mean?','Help me prepare questions for my doctor','Explain HbA1c in simple words','When should I go to an emergency room?'];
const msgsHtml=()=>(S.chat.length?S.chat.map((m,i)=>`<div class="m ${m.r}"><div class="bub ${m.err?'er':''}">${fmt(m.x)}${m.r=='a'&&!m.err?`<div class="act mt"><button class="sm gn" onclick="speak(S.chat[${i}].x)" aria-label="${t('aread')}">🔊</button><button class="sm bl" onclick="cp(S.chat[${i}].x)" aria-label="${t('acopy')}">📋</button><button class="sm am" onclick="speechSynthesis.cancel()" aria-label="${t('astop')}">⏹</button></div>`:''}</div></div>`).join(''):`<div class="m a"><div class="bub">👋 ${hi()?'नमस्ते! मैं Vytalyn हूँ। स्वास्थ्य से जुड़ा कोई भी सवाल पूछें।':'Hello! I am Vytalyn. Ask me any health question.'}</div></div><div class="chips">${PR().map((x,i)=>`<button class="sec chip" onclick="send(PR()[${i}])">${esc(x)}</button>`).join('')}</div>`)+(busy?`<div class="m a"><div class="bub">⏳ ${t('typing')}</div></div>`:'');
function draw(){const e=document.getElementById('msgs');if(e){e.innerHTML=msgsHtml();e.scrollTop=e.scrollHeight}}
async function chatAI(h){const L=(hi()?'The interface language is Hindi: reply ONLY in Hindi (Devanagari script), translating everything including names such as Claude (क्लॉड) and Harshvardhan (हर्षवर्धन); keep only the name Vytalyn in Latin letters. ':'Reply in the language the user writes in (Hindi in Devanagari, or simple English). ')+'Be clear, kind and concise, as general health education.';
if(S.key){try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:1200,system:SYS+' '+L,messages:h})});const j=await r.json();if(!r.ok)throw new Error(apiMsg(j,r.status));return j.content.map(x=>x.text||'').join('')}catch(e){if(!(e instanceof TypeError)&&!window.claude)throw e}}
const sm=window.claude&&await window.claude.use('sample');if(!sm)throw new Error(t('noai'));
return(await sm([{role:'user',content:SYS+' '+L+' The conversation follows; answer the last user message.'}].concat(h),{cache:false})).text}
async function send(txt){const el=document.getElementById('tx'),v=(txt||(el&&el.value)||'').trim();if(!v||busy)return;S.chat.push({r:'u',x:v});if(el)el.value='';
if(/who\s*ami\b|who\s*(r|ar)\s*(you|u)\b|who\s+(are|made|built|created|developed)\s+(you|u)|your\s+(name|creator|developer)|who\s+developed|कौन\s*हो|आप\s*कौन|किसने\s*बनाया|तुम्हारा\s*नाम|आपका\s*नाम/i.test(v)){S.chat.push({r:'a',x:hi()?'मैं Vytalyn हूँ, जिसे क्लॉड और हर्षवर्धन ने विकसित किया है। मैं स्वास्थ्य जानकारी आसान भाषा में समझाने में मदद करता हूँ। मैं डॉक्टर नहीं हूँ और पेशेवर चिकित्सा सलाह का विकल्प नहीं हूँ।':'I am Vytalyn, developed by Claude and Harshvardhan. I help explain health information in simple language. I am not a doctor and do not replace professional medical advice.'});save();draw();return}
busy=true;draw();
try{const h=S.chat.filter(m=>!m.err).slice(-12).map(m=>({role:m.r=='u'?'user':'assistant',content:m.x}));while(h.length&&h[0].role!='user')h.shift();S.chat.push({r:'a',x:await chatAI(h)})}
catch(e){S.chat.push({r:'a',err:1,x:'⚠ '+((e&&e.code=='not_granted')?t('denied'):(e&&(e.message||e.text))||String(e))})}
busy=false;S.chat=S.chat.slice(-60);save();draw()}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t('nomic'));return}rec=new SR();rec.lang=hi()?'hi-IN':'en-IN';rec.interimResults=true;rec.onresult=e=>{document.getElementById('tx').value=[...e.results].map(r=>r[0].transcript).join(' ')};rec.onerror=e=>toast(t('micerr')+' ('+e.error+')');try{rec.start()}catch(x){}}
function say(){const v=document.getElementById('tx').value.trim();if(!v)return;if(!('speechSynthesis' in window)){toast(t('nomic'));return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(v);u.lang=hi()?'hi-IN':'en-IN';speechSynthesis.speak(u)}
function addQ(){const v=document.getElementById('tx').value.trim();if(v){S.q.push(v);save();R()}}
V.settings=()=>`<div class="card"><h2>${t('set')}</h2><h3>🔑 ${t('key')}</h3><p class="mu">${t('keynote')}</p><form onsubmit="saveK(event)"><input name="k" type="password" autocomplete="off" aria-label="${t('key')}" placeholder="sk-ant-…" value="${esc(S.key||'')}"><p class="act"><button class="gn">💾 ${t('save')}</button><button type="button" class="dn" onclick="S.key='';save();R()">${t('rm')}</button></p></form><p>${S.key?'✅ '+t('keyon'):'⚪ '+t('keyoff')}</p><hr style="border:0;border-top:1px solid var(--ln)"><p><button class="bl" onclick="notif()">🔔 ${t('notif')}</button></p><p class="mu">${t('nstat')} <br><b>${'Notification' in window?t('perm')+': '+t('p_'+Notification.permission):t('nsup')}</b></p><p>🔒 ${t('privacy')}</p><p><button class="dn" onclick="conf(()=>{localStorage.removeItem('vy');location.hash='#/';location.reload()})">${t('wipe')}</button></p></div>`;
const notif=()=>{if(!('Notification' in window)){toast(t('nsup'));return}Notification.requestPermission().then(()=>R())};
setInterval(()=>{const n=new Date(),hm=n.toTimeString().slice(0,5),d=ymd();if(!S.auth)return;S.med.filter(m=>m.act).forEach(m=>m.times.includes(hm)&&!S.log[d+'|'+m.id+'|'+hm]&&!S['n'+d+m.id+hm]&&(S['n'+d+m.id+hm]=1,toast(t('due')+' '+m.name),'Notification' in window&&Notification.permission=='granted'&&new Notification('Vytalyn',{body:t('due')+' '+m.name+' — '+m.dose})))},20000);
const pub=['','login','signup'];
function R(keep){const h=(location.hash.replace(/^#\/?/,'')||'').split('?')[0];let v=h=='appts'?'appts':h=='meds'?'meds':h;if(!pub.includes(v)&&!S.auth){location.hash='#/login';return}if(!V[v]){v=''}if(S.auth&&pub.includes(v)){location.hash='#/'+(S.route&&!pub.includes(S.route)&&V[S.route]?S.route:'dash');return}if(S.auth&&S.route!==v){S.route=v;save()}
if(R.v!==v){AI=null;R.v=v}document.documentElement.lang=hi()?'hi':'en';document.title=hi()?'Vytalyn — डिजिटल स्वास्थ्य सेवा':'Vytalyn — Digital Healthcare';const y=scrollY;document.getElementById('app').innerHTML=V[v]();const mm=document.getElementById('msgs');if(mm)mm.scrollTop=mm.scrollHeight;document.getElementById('ft').innerHTML=`<b>${hi()?'द्वारा हर्षवर्धन':'By Harshvardhan'}</b><br>${hi()?'बीवीबी विद्याश्रम के छात्र':'Student of BVB Vidyashram'}<br>${t('cc')}: <a href="mailto:hellomrhell663@gmail.com">hellomrhell663@gmail.com</a>`;
const L=[['dash','dash'],['profile','profile'],['records','rec'],['appts','appt'],['meds','med'],['ask','ask'],['settings','set']];
document.getElementById('nav').innerHTML=(S.auth?L.map(x=>`<a href="#/${x[0]}" class="${x[0]==v?'on':''}">${t(x[1])}</a>`).join('')+`<a href="#" onclick="conf(()=>{S.auth=false;S.route='';save();location.hash='#/';R()},t('lo'),t('logout'));return false">${t('logout')}</a>`:`<a href="#/login">${t('login')}</a>`)+`<a href="#" onclick="S.lang=hi()?'en':'hi';save();R();return false">🌐 ${t('lang')}</a>`;
if(keep)scrollTo(0,y)}
V.records=V.records;V.records=V.records;
const _r=V.records;V.records=()=>_r();
V.settings=V.settings;
V['records']=_r;
V.profile=V.profile;
addEventListener('hashchange',()=>R());if(S.auth&&!location.hash)location.hash='#/'+(S.route||'dash');R();
</script></body></html>
